<h2>Update Skill</h2>

<form (ngSubmit)="updateSkill()" #skillForm="ngForm" novalidate>
    <hr>
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" [(ngModel)]="skill.name" required>
    </div>

    <div class="form-group">
        <label for="type">Type</label>
        <input type="text" name="type" id="type" [(ngModel)]="skill.type" required>
    </div>

    <div class="form-group">
        <label for="level">Level</label>
        <input type="text" name="level" id="level" [(ngModel)]="skill.level" required>
    </div>

    <div class="form-group">
        <label for="rating">Rating</label>
        <input type="text" name="rating" id="rating" [(ngModel)]="skill.rating" required>
    </div>

    <button type="submit" [disabled]="skillForm.invalid" class="btn btn-primary">
        Update
    </button>
</form>
